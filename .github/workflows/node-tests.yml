name: Node tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run test suite
        working-directory: src
        run: npm test
      - name: Check runtime syntax
        working-directory: src
        run: npm run check
      - name: Install build tool
        working-directory: src
        run: npm install --no-audit --no-fund
      - name: Build standalone HTML
        working-directory: src
        run: npm run build
      - name: Upload standalone game
        uses: actions/upload-artifact@v4
        with:
          name: orca-adventure-html
          path: dist/orca-adventure.html
          if-no-files-found: error
