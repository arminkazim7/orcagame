<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#031b32">
  <title>Orca Adventure</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;background:#031b32}
    body{display:grid;place-items:center;overflow:hidden}
    .game-shell{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;max-height:100dvh;overflow:hidden;background:#063b58}
    #game{display:block;width:100%;height:100%;image-rendering:pixelated}
    #ui-root{position:absolute;inset:0;overflow:auto}.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-aspect-ratio:1/1){.game-shell{width:100vw}}
  </style>
</head>
<body>
  <main class="game-shell" aria-label="Orca Adventure game">
    <canvas id="game" width="960" height="540" aria-label="Orca Adventure playfield" aria-describedby="game-instructions"></canvas>
    <p id="game-instructions" class="sr-only">Platform adventure game. Use Left and Right arrow keys or A and D to swim, Space or Up to jump, Down or S to drop through one-way platforms, and X or F to shoot. Press Escape to pause or resume. On touch screens, use the on-screen controls.</p>
    <div id="ui-root"></div>
  </main>
  <script type="module" src="../src/browser-entry.js"></script>
</body>
</html>
